<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Presentation OS · Gerador PPTX</title>
<link rel="stylesheet" href="src/styles.css">
<style>body{padding:32px}.generator{max-width:900px;margin:auto}.generator .form-card{padding:28px}.generator textarea{min-height:260px}.generator h1{margin:0 0 8px}.generator .actions{display:flex;gap:12px;align-items:center}.status{font-size:12px;color:#5f6368}</style>
<script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs/dist/pptxgen.bundle.js"></script>
</head>
<body>
<main class="generator">
<div class="form-card">
<p class="eyebrow">PRESENTATION OS</p>
<h1>Gerar PowerPoint</h1>
<p>Cole o conteúdo. O arquivo gerado é um PowerPoint editável.</p>
<label>Título<input id="title" value="Apresentação Executiva"></label>
<label>Conteúdo<textarea id="content">O projeto busca automatizar apresentações corporativas mantendo qualidade de conteúdo e identidade visual. A solução deve transformar documentos em uma narrativa clara. O foco é reduzir retrabalho, preservar consistência e permitir governança de marca.</textarea></label>
<div class="actions"><button id="generate" class="btn primary">Gerar PowerPoint</button><span id="status" class="status"></span></div>
</div>
</main>
<script>
const button=document.getElementById('generate');
button.addEventListener('click',async()=>{
 const title=document.getElementById('title').value.trim()||'Apresentação';
 const source=document.getElementById('content').value.trim();
 if(!source){alert('Adicione conteúdo para gerar a apresentação.');return;}
 button.disabled=true;document.getElementById('status').textContent='Gerando arquivo...';
 try{
  const pptx=new PptxGenJS(); pptx.layout='LAYOUT_WIDE'; pptx.author='Presentation OS'; pptx.title=title; pptx.lang='pt-BR';
  const cover=pptx.addSlide(); cover.background={color:'20252B'}; cover.addText(title,{x:1,y:1.8,w:10.8,h:1.4,fontFace:'Arial',fontSize:34,bold:true,color:'FFFFFF',margin:0,fit:'shrink'}); cover.addText('Apresentação gerada pelo Presentation OS',{x:1,y:3.5,w:9,h:.5,fontFace:'Arial',fontSize:16,color:'C9D0D6',margin:0});
  const parts=source.replace(/\n+/g,' ').split(/(?<=[.!?])\s+/).map(x=>x.trim()).filter(Boolean).slice(0,8);
  parts.forEach((text,i)=>{const slide=pptx.addSlide(); slide.background={color:'F7F8FA'}; slide.addText(''+(i+1).toString().padStart(2,'0'),{x:12.1,y:.55,w:.5,h:.25,fontFace:'Arial',fontSize:9,color:'7B8187',align:'right',margin:0}); slide.addText(text.split(/\s+/).slice(0,8).join(' '),{x:.75,y:.65,w:11.2,h:.75,fontFace:'Arial',fontSize:25,bold:true,color:'202124',margin:0,fit:'shrink'}); slide.addShape(pptx.ShapeType.roundRect,{x:.75,y:1.75,w:11.85,h:4.5,fill:{color:'FFFFFF'},line:{color:'DFE3E7'}}); slide.addText(text,{x:1.15,y:2.15,w:11.05,h:3.55,fontFace:'Arial',fontSize:20,color:'34373B',margin:.03,valign:'mid',fit:'shrink'});});
  const end=pptx.addSlide(); end.background={color:'EEF1F4'}; end.addText('Próximos passos',{x:1,y:1.6,w:10.5,h:.8,fontFace:'Arial',fontSize:30,bold:true,color:'202124',margin:0}); end.addText('Revise a narrativa, ajuste a identidade visual e valide a apresentação final.',{x:1,y:2.8,w:10.2,h:1.4,fontFace:'Arial',fontSize:22,color:'4F5862',margin:0,fit:'shrink'});
  const file=title.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9-_ ]/g,'').trim().replace(/\s+/g,'-')||'apresentacao';
  await pptx.writeFile({fileName:file+'.pptx',compression:true}); document.getElementById('status').textContent='PowerPoint gerado.';
 }catch(e){console.error(e);document.getElementById('status').textContent='Erro ao gerar. Recarregue e tente novamente.';} finally{button.disabled=false;}
});
</script>
</body>
</html>
